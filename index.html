<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#026CDF">
    <link rel="icon" href="assets/android-launchericon-192-192.png" type="image/png">
    <title>Ticketmaster</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background-color: #026CDF;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #splash-logo {
            width: 150px;
            height: 150px;
        }
    </style>
</head>
<body>
    <img id="splash-logo" src="assets/android-launchericon-512-512.png" alt="App Logo">

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .catch(err => console.error('Service Worker registration failed:', err));
        }

        // No login: go straight to the home page.
        setTimeout(() => {
            window.location.replace('home.html');
        }, 500);
    </script>
</body>
</html>
